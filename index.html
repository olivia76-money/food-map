<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Food Map｜網址與截圖辨識測試版</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#24342f;background:#f7f8f5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:60px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #e2e7e2}header strong{font-size:20px;color:#176e51}header .grow{flex:1}.pill{border:1px solid #d7e2d8;border-radius:30px;background:white;padding:9px 12px}.primary{background:#187858;color:white;border:0;border-radius:12px;padding:11px 15px}.soft{background:#eaf4ed;color:#155b42;border:0;border-radius:12px;padding:10px 13px}.danger{color:#aa3737}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;height:calc(100dvh - 60px)}#map{height:100%;background:#e6eee6}.side{background:#fff;overflow:auto;border-left:1px solid #e0e8e1;padding:15px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tools button{padding:8px 11px}.card{border:1px solid #e1e7e2;border-radius:15px;padding:13px;margin:10px 0;background:white}.card h3{margin:0 0 7px;font-size:16px}.muted{color:#718077;font-size:13px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.chip{font-size:12px;padding:4px 7px;border-radius:20px;background:#edf4ef;color:#25674c}.banner{background:#fff3d9;border:1px solid #f0d99e;border-radius:12px;padding:11px;margin-bottom:10px}.field{display:block;margin:11px 0;font-size:13px;font-weight:600}.field input,.field select,.field textarea{display:block;width:100%;border:1px solid #d6e0d9;border-radius:10px;padding:10px;margin-top:5px;background:white;color:#24342f}.field textarea{min-height:74px}.overlay{position:fixed;inset:0;background:#13251d88;display:none;z-index:2000;align-items:center;justify-content:center;padding:14px}.overlay.show{display:flex}.modal{background:#fff;border-radius:20px;padding:18px;width:min(520px,100%);max-height:90dvh;overflow:auto}.modal h2{margin:0 0 8px;font-size:20px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.empty{text-align:center;padding:28px 10px;color:#738278}.notice{border-bottom:1px solid #e7ece7;padding:12px 0}.source{border-top:1px solid #e8ece8;margin-top:9px;padding-top:9px}.source a{color:#137b59}.leaflet-container{font-family:inherit}.mini{font-size:12px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263e32;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:3000;max-width:90vw}.fakeMap{display:flex;align-items:center;justify-content:center;height:100%;padding:25px;text-align:center;color:#4b6657}body.mobile .layout{display:block}body.mobile #map{height:45dvh}body.mobile .side{height:calc(55dvh - 60px);border-left:0;border-top:1px solid #ddd;border-radius:20px 20px 0 0;position:relative;margin-top:-12px;z-index:700}body.mobile header{gap:6px;padding:0 9px}body.mobile header strong{font-size:18px}body.mobile header button{font-size:13px;padding:8px} @media(max-width:750px){.layout{display:block}#map{height:45dvh}.side{height:calc(55dvh - 60px);border-left:0;border-top:1px solid #ddd;border-radius:20px 20px 0 0;position:relative;margin-top:-12px;z-index:700}header{gap:6px;padding:0 9px}header strong{font-size:18px}header button{font-size:13px!important;padding:8px!important}}.category-filters{display:flex;gap:7px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:thin}.category-option{white-space:nowrap;flex-shrink:0}.category-selected{background:#187858!important;color:white!important;border-color:#187858!important}.card[role="button"]:active{transform:scale(.995)}.card[role="button"]:focus-visible{outline:3px solid #15866d;outline-offset:2px}</style></head><body><header><strong>📍 Food Map</strong><div class="grow"></div><button class="pill" onclick="showNotifications()" id="bell">🔔 0</button><button class="pill" onclick="showManagement()">⚙️ 管理</button><button class="primary" onclick="openAdd()">＋ 新增</button></header><main class="layout"><div id="map"><div class="fakeMap">地圖載入中…<br>若無網路，仍可使用右側餐廳清單。</div></div><section class="side"><div class="tools"><button class="pill" onclick="switchMap('shared')" id="sharedTab">家庭共享</button><button class="pill" onclick="switchMap('private')" id="privateTab">我的私人</button><button class="pill" onclick="toggleNearby()" id="nearbyBtn">📍 我的附近</button><button class="pill" onclick="setRadius()" id="radiusBtn">半徑 3 km</button></div><label class="field">搜尋餐廳<input id="search" placeholder="名稱、料理、備註…" oninput="renderList();renderMarkers()"></label><div class="row between"><b id="listTitle">餐廳清單</b><span class="muted" id="count"></span></div><div id="categoryFilters" class="category-filters" aria-label="餐廳分類篩選"></div><div id="list"></div></section></main><div id="overlay" class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const KEY='foodmap_demo_v1';const now=()=>Date.now();const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const seed={restaurants:[{id:'r1',name:'範例｜港式茶餐廳',cuisine:'港式',address:'高雄市前鎮區三多三路',lat:22.6149,lng:120.3063,map:'shared',note:'適合家庭聚餐',sources:[{id:'s1',author:'我',platform:'Instagram',url:'https://www.instagram.com/',note:'想試試看',broken:false,added:now()-86400000}]},{id:'r2',name:'範例｜咖啡小店',cuisine:'咖啡',address:'高雄市苓雅區三多四路',lat:22.6131,lng:120.3028,map:'private',note:'週末可以去',sources:[]}],trash:[],notifications:[{id:'n1',title:'歡迎使用 Food Map 測試版',detail:'所有資料僅儲存在這台裝置的瀏覽器。',read:false,at:now()}],operations:[],drafts:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(JSON.stringify(seed))}catch{db=JSON.parse(JSON.stringify(seed))}let current='shared',radius=3,map,markers=[],selected=null,activeCategory='全部';
let userPosition=null,userMarker=null,nearbyOnly=false;
function distanceKm(a,b,c,d){const R=6371,toRad=x=>x*Math.PI/180,dl=toRad(c-a),dn=toRad(d-b);const h=Math.sin(dl/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))}
function restaurantDistance(r){return userPosition&&Number.isFinite(Number(r.lat))&&Number.isFinite(Number(r.lng))&&r.lat!=null&&r.lng!=null?distanceKm(userPosition.lat,userPosition.lng,Number(r.lat),Number(r.lng)):null}
function requestMyLocation(){if(!navigator.geolocation){toast('此瀏覽器不支援定位');return}toast('正在取得目前位置，請允許定位權限');navigator.geolocation.getCurrentPosition(pos=>{userPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};if(map){if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker([userPosition.lat,userPosition.lng],{radius:9,color:'#176eaa',fillColor:'#3a9ce2',fillOpacity:0.9}).addTo(map).bindPopup('我的位置');map.setView([userPosition.lat,userPosition.lng],14)}nearbyOnly=true;updateNearbyButton();renderList();renderMarkers();toast('已定位，顯示附近收藏餐廳')},err=>toast(err.code===1?'定位權限遭拒絕，請至瀏覽器設定允許定位':'目前無法取得位置，請稍後再試'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
function updateNearbyButton(){let b=document.getElementById('nearbyBtn');if(b)b.textContent=nearbyOnly?'📍 附近：開':'📍 我的附近'}
function toggleNearby(){if(!userPosition){requestMyLocation();return}nearbyOnly=!nearbyOnly;updateNearbyButton();renderList();renderMarkers()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('本機儲存失敗，請確認瀏覽器空間');return false}};function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',3300)}function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show')}function initMap(){if(!window.L){document.getElementById('map').innerHTML='<div class="fakeMap">無法載入線上地圖底圖；餐廳清單與其他測試功能仍可使用。</div>';return}map=L.map('map').setView([22.614,120.304],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);renderMarkers()}function matchingRestaurants(){let q=document.getElementById('search').value.trim().toLowerCase();return db.restaurants.filter(r=>r.map===current&&(activeCategory==='全部'||(r.cuisine||'未分類').split(/[、,，]/).map(x=>x.trim()).includes(activeCategory))&&[r.name,r.cuisine,r.note,r.address].join(' ').toLowerCase().includes(q)&&(!nearbyOnly||(restaurantDistance(r)!==null&&restaurantDistance(r)<=radius))).sort((a,b)=>userPosition?(restaurantDistance(a)??Infinity)-(restaurantDistance(b)??Infinity):0)}function chooseCategory(c){activeCategory=c;renderList();renderMarkers()}function renderMarkers(){if(!map)return;markers.forEach(x=>map.removeLayer(x));markers=[];matchingRestaurants().filter(r=>r.lat!==null&&r.lng!==null&&r.lat!==undefined&&r.lng!==undefined&&Number.isFinite(Number(r.lat))&&Number.isFinite(Number(r.lng))).forEach(r=>{let m=L.marker([Number(r.lat),Number(r.lng)]).addTo(map).bindPopup(esc(r.name));m.on('click',()=>showRestaurant(r.id));markers.push(m)})}function switchMap(m){current=m;selected=null;activeCategory='全部';renderList();renderMarkers()}function renderList(){
 document.getElementById('sharedTab').style.background=current==='shared'?'#d6efe0':'';
 document.getElementById('privateTab').style.background=current==='private'?'#d6efe0':'';
 const all=db.restaurants.filter(r=>r.map===current);
 const categories=['全部',...new Set(all.flatMap(r=>(r.cuisine||'未分類').split(/[、,，]/).map(x=>x.trim()).filter(Boolean)))].sort((a,b)=>a==='全部'?-1:b==='全部'?1:a.localeCompare(b,'zh-Hant'));
 if(!categories.includes(activeCategory))activeCategory='全部';
 const categoryBox=document.getElementById('categoryFilters');
 categoryBox.innerHTML=categories.map(c=>`<button type="button" class="pill category-option ${c===activeCategory?'category-selected':''}" aria-pressed="${c===activeCategory}" data-category="${esc(c)}">${esc(c)} (${c==='全部'?all.length:all.filter(r=>(r.cuisine||'未分類').split(/[、,，]/).map(x=>x.trim()).includes(c)).length})</button>`).join('');
 categoryBox.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>chooseCategory(b.dataset.category)));
 let rs=matchingRestaurants();
 document.getElementById('listTitle').textContent=current==='shared'?'家庭共享餐廳':'我的私人餐廳';
 document.getElementById('count').textContent=rs.length+' 間'+(nearbyOnly?'（'+radius+' km 內）':'');
 document.getElementById('list').innerHTML=rs.length?rs.map(r=>`<div class="card" role="button" tabindex="0" onclick="showRestaurant('${r.id}')" onkeydown="if(event.key==='Enter')showRestaurant('${r.id}')" style="cursor:pointer"><div class="row between"><h3>🍽️ ${esc(r.name)}</h3><span class="chip">${esc(r.cuisine||'未分類')}</span></div><div class="muted">📍 ${esc(r.address||'未填地址')}${restaurantDistance(r)!==null?' · '+restaurantDistance(r).toFixed(1)+' km':''}</div><div class="muted" style="margin-top:6px">🔗 ${r.sources.length} 筆推薦來源 · ${r.sources.filter(s=>s.broken).length} 筆失效</div></div>`).join(''):'<div class="empty">'+(all.length?'這個分類或搜尋條件目前沒有餐廳，可選「全部」查看。':'目前沒有餐廳，按右上角「＋ 新增」試試看。')+'</div>';
}function setRadius(){let a=[1,3,5,10];radius=a[(a.indexOf(radius)+1)%a.length];document.getElementById('radiusBtn').textContent=`半徑 ${radius} km`;renderList();renderMarkers();toast(nearbyOnly?'已篩選 '+radius+' 公里內有座標的餐廳':'半徑已設定；點「我的附近」啟用篩選')}function platformOf(url){try{let h=new URL(url).hostname.toLowerCase();if(h.includes('instagram.com'))return 'Instagram Reels / 貼文';if(h.includes('threads.net')||h.includes('threads.com'))return 'Threads';if(h.includes('tiktok.com'))return 'TikTok';if(h.includes('google.')||h.includes('maps.app.goo.gl')||h.includes('goo.gl'))return 'Google Maps';if(h.includes('youtube.com')||h.includes('youtu.be'))return 'YouTube';if(h.includes('facebook.com')||h.includes('fb.watch'))return 'Facebook';return '餐廳網站 / 其他'}catch{return '未知'}}
function googlePlaceHint(url){try{let u=new URL(url),p=u.pathname;let m=p.match(/\/place\/([^/]+)/);if(m)return decodeURIComponent(m[1].replace(/\+/g,' '));return u.searchParams.get('query')||u.searchParams.get('q')||u.searchParams.get('destination')||''}catch{return ''}}

const FOOD_CATEGORIES=['台式','中式','日式','韓式','火鍋','燒肉','義式','美式','港式','小吃','早午餐','咖啡廳','甜點','冰品','飲料','其他'];
function categoryPickerMarkup(){return `<label class="field">餐廳分類（可複選，也可自行輸入）<input name="cuisine" class="newCuisine" oninput="refreshNewCuisineChoices()" placeholder="點選下方分類"></label><div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:12px" id="newCuisineChoices">${FOOD_CATEGORIES.map(c=>`<button type="button" class="pill" data-cuisine="${c}" onclick="toggleNewCuisine(this)">${c}</button>`).join('')}</div>`}
function toggleNewCuisine(btn){const input=document.querySelector('.newCuisine');if(!input)return;let arr=input.value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);const c=btn.dataset.cuisine;input.value=(arr.includes(c)?arr.filter(x=>x!==c):[...arr,c]).join('、');refreshNewCuisineChoices()}
function refreshNewCuisineChoices(){const input=document.querySelector('.newCuisine');if(!input)return;const arr=input.value.split(/[、,，]/).map(x=>x.trim());document.querySelectorAll('#newCuisineChoices button').forEach(btn=>{const active=arr.includes(btn.dataset.cuisine);btn.classList.toggle('category-selected',active);btn.setAttribute('aria-pressed',String(active))})}

function openAdd(){modal(`<h2>🔗 貼上網址新增</h2><p class="muted">Google Maps 短網址由後端展開；IG／FB／Threads 會嘗試取得公開頁面的標題與摘要，不會讀取影片或留言。</p><form onsubmit="inspectLink(event)"><label class="field">Reels、Threads、TikTok、Google Maps 或餐廳網址<input id="pasteLink" type="url" required placeholder="https://..."></label><div id="inspectStatus" class="muted">網址不會自動讀取剪貼簿。</div><div class="actions"><button type="button" class="pill" onclick="openScreenshot()">📷 上傳截圖辨識</button><button type="button" class="pill" onclick="openManualAdd()">手動新增</button><button class="primary">辨識網址 →</button></div></form><p class="muted mini">截圖辨識會在本機瀏覽器執行文字辨識，不會上傳到 Food Map 伺服器。首次載入辨識引擎需要網路。</p>`)}
let incomingUrl='',incomingPlatform='',incomingHint='',incomingDescription='';
async function inspectLink(e){
 e.preventDefault();const url=document.getElementById('pasteLink').value.trim();
 try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{toast('請貼上有效的網址');return}
 incomingUrl=url;incomingPlatform=platformOf(url);incomingHint='';incomingDescription='';
 if(incomingPlatform!=='Google Maps'){
   if(['Instagram Reels / 貼文','Facebook','Threads'].includes(incomingPlatform)){
    const status=document.getElementById('inspectStatus');if(status)status.textContent='正在讀取公開貼文摘要（可能受平台限制）…';
    try{
     const res=await fetch('/.netlify/functions/resolve-social?url='+encodeURIComponent(url));
     const data=await res.json();if(!res.ok)throw Error(data.error||'服務暫時無法使用');
     if(data.available){
      incomingDescription=[data.title,data.description].filter(Boolean).join('\n');
      const f=extractScreenshotFields(incomingDescription);
      incomingHint=f.name||'';
      showLinkForm('已取得公開頁面摘要（不是影片或留言）；以下資訊僅為文字推測，請自行核對。');
      if(f.address)document.getElementById('linkedAddress').value=f.address;
      const note=document.getElementById('socialPreview');if(note)note.textContent=incomingDescription;
     }else showLinkForm('平台無法提供公開摘要：'+(data.reason||'請改用截圖辨識'));
    }catch(err){showLinkForm('公開摘要讀取失敗：'+String(err.message).slice(0,100)+'。請改用截圖辨識。')}
   }else showLinkForm('目前此平台尚未支援網址內容讀取，請改用截圖或貼上文字。');
   return;
 }
 const el=document.getElementById('inspectStatus');if(el)el.textContent='正在透過網站服務展開 Google Maps 網址…';
 try{
  const res=await fetch('/.netlify/functions/resolve-map?url='+encodeURIComponent(url),{headers:{'Accept':'application/json'}});
  const data=await res.json();if(!res.ok)throw Error(data.error||'解析服務暫時無法使用');
  incomingHint=data.name||googlePlaceHint(data.resolvedUrl||url)||'';
  const status=data.name?'已展開 Google Maps 網址並擷取地點名稱；地址與地圖位置仍需核對。':'已展開網址，但尚無法確認店名；請補充資訊或查詢公開地圖。';
  showLinkForm(status);
  if(data.address){document.getElementById('linkedAddress').value=data.address}
  if(data.verified===true && Number.isFinite(data.lat)&&Number.isFinite(data.lng)){
   document.getElementById('linkedLat').value=data.lat;document.getElementById('linkedLng').value=data.lng;
  }
 }catch(err){incomingHint=googlePlaceHint(url);showLinkForm('目前無法透過後端解析此網址（'+String(err.message).slice(0,90)+'）。這不是辨識成功；請使用地圖查詢或補充資料。')}
}
function showLinkForm(status){let q=esc(incomingHint);let existing=db.restaurants.filter(r=>incomingHint&&r.name.toLowerCase().includes(incomingHint.toLowerCase())).slice(0,4);modal(`<h2>確認餐廳資料</h2><div class="banner"><b>${esc(incomingPlatform)}</b><br>${esc(status)}<br><span class="mini">社群平台常限制外部讀取影片或貼文內容，單靠網址不能保證找到餐廳。</span></div>${existing.length?`<div class="card"><b>可能已收藏</b>${existing.map(r=>`<p><button class="soft" onclick="attachIncoming('${r.id}')">加入「${esc(r.name)}」的推薦來源</button></p>`).join('')}</div>`:''}<div id="socialPreview" class="muted mini" style="white-space:pre-wrap;max-height:120px;overflow:auto"></div><div class="row"><button class="soft" onclick="openScreenshot()">📷 改用截圖辨識</button><button class="soft" onclick="openPasteText()">貼上貼文文字</button></div><form onsubmit="saveLinkedRestaurant(event)"><label class="field">餐廳名稱（必要）<input id="linkedName" name="name" value="${q}" required placeholder="例如：某某拉麵"></label><label class="field">地址或地點關鍵字<input name="address" id="linkedAddress" placeholder="例如：高雄市苓雅區某某路"></label><div class="row"><button class="soft" type="button" onclick="searchPlace()" id="placeLookup">依名稱／地址查詢公開地圖</button></div><div id="placeResults" class="muted">地點查詢需連線；結果請自行確認。</div>${categoryPickerMarkup()}<label class="field">加入地圖<select name="map"><option value="shared" ${current==='shared'?'selected':''}>家庭共享</option><option value="private" ${current==='private'?'selected':''}>我的私人</option></select></label><div class="row"><label class="field" style="flex:1">緯度（查詢地點後帶入）<input name="lat" id="linkedLat" type="number" step="any" placeholder="尚未定位"></label><label class="field" style="flex:1">經度<input name="lng" id="linkedLng" type="number" step="any" placeholder="尚未定位"></label></div><label class="field">推薦來源備註<textarea name="sourceNote" placeholder="例如：這支 Reels 的推薦重點"></textarea></label><label class="field">餐廳共同備註<textarea name="note"></textarea></label><div class="actions"><button type="button" class="pill" onclick="openAdd()">返回</button><button class="primary">確認儲存</button></div></form>`)}
async function searchPlace(){let q=[document.getElementById('linkedName').value,document.getElementById('linkedAddress').value].filter(Boolean).join(' ');if(!q.trim()){toast('請先輸入餐廳名稱或地址');return}let el=document.getElementById('placeResults');el.textContent='正在查詢公開地圖…';try{let resp=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=4&accept-language=zh-TW&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});if(!resp.ok)throw Error('查詢服務暫時無法使用');let results=await resp.json();window.foodPlaceResults=results;el.innerHTML=results.length?results.map((r,i)=>`<div class="card"><div class="mini">${esc(r.display_name)}</div><button type="button" class="soft" onclick="choosePlace(${i})">選擇這個地點</button></div>`).join(''):'找不到可靠的地點結果。可以改用更完整的地址，或先儲存來源待補位置。'}catch{el.textContent='目前無法連線查詢公開地圖，請手動補上資訊；不會自動猜測位置。'}}

function extractScreenshotFields(text){let lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let addrMatch=text.match(/(?:高雄市|臺北市|台北市|新北市|臺中市|台中市|臺南市|台南市|桃園市|基隆市|新竹市|新竹縣|嘉義市|嘉義縣|屏東縣|宜蘭縣|彰化縣|雲林縣|苗栗縣|南投縣|花蓮縣|臺東縣|台東縣|澎湖縣)[^\n，,。#]{3,65}?(?:\d+(?:之\d+)?號)/);let address=addrMatch?.[0]||'';let phone=(text.match(/09\d{2}[\s-]?\d{3}[\s-]?\d{3}|0\d{1,2}[\s-]?\d{3,4}[\s-]?\d{4}/)||[])[0]||'';let hours=(text.match(/(?:[01]?\d|2[0-3]):[0-5]\d\s*[-–~至]\s*(?:[01]?\d|2[0-3]):[0-5]\d/)||[])[0]||'';let names=[];for(let l of lines){let m=l.match(/[「『]([^」』]{2,25})[」』]/);if(m)names.push(m[1]);}for(let l of lines){if(/(?:冰|食堂|咖啡|麵|餐廳|小吃|甜點|茶屋|火鍋|燒肉|便當|拉麵)/.test(l)&&l.length<=18&&!/^#/.test(l))names.push(l.replace(/^[#＃\s]+/,''))}let name=names.find(x=>x.length>=2)||'';return{name,address,phone,hours}}

   box.innerHTML='<b>找到符合部分條件的候選地點，請先核對完整地址：</b>'+window.editPlaceCandidates.map((p,i)=>`<button type="button" class="soft" style="display:block;width:100%;text-align:left;margin:6px 0" onclick="selectEditPlace(${i})">${esc(p.display_name)}</button>`).join('');
  }else{
   box.innerHTML='無法可靠確認位置，<b>不會使用猜測座標</b>。'+(data.reason==='no_results'?'公開地圖查無此門牌或店名。':'找到的資料不足以核對完整門牌。')+(data.diagnostics?.serviceError?' 部分免費查詢服務暫時無法回應。':'')+(data.googleFeatureId?' Google Maps 地點識別碼已讀取，但它不是座標，不能直接用來放圖釘。':'')+' 已嘗試 '+(data.diagnostics?.queriesAttempted||0)+' 次 OpenStreetMap 查詢；其他來源查詢 '+(data.diagnostics?.photonAttempts?.length||0)+' 次。已排除 '+(data.diagnostics?.rejectedCount||0)+' 筆不符合地址的候選地點。<details style="margin-top:10px"><summary>查看定位診斷（可截圖回報）</summary><pre style="white-space:pre-wrap;word-break:break-word;font-size:12px">'+esc(JSON.stringify(data.diagnostics||{},null,2))+'</pre></details>';
  }
 }catch(e){box.textContent='自動查詢失敗：'+e.message+'。請確認已部署 Netlify Functions，而非只有靜態 HTML。'}
}
function selectEditPlace(i){
 const p=window.editPlaceCandidates?.[i];if(!p)return;
 document.getElementById('editLat').value=p.lat;document.getElementById('editLng').value=p.lon;window.manualPicked=true;
 document.getElementById('editPlaceResults').textContent='已選擇：'+p.display_name+'。請確認位置正確，再按儲存變更。';
}

let manualMap=null,manualMarker=null;
function openManualPicker(){
 const holder=document.getElementById('manualPicker');if(!holder)return;
 if(!window.L){toast('地圖程式未載入，請確認網路連線');return}
 holder.style.display='block';
 if(manualMap){setTimeout(()=>manualMap.invalidateSize(),80);return}
 const oldLat=Number(document.getElementById('editLat').value),oldLng=Number(document.getElementById('editLng').value);
 const valid=Number.isFinite(oldLat)&&Number.isFinite(oldLng)&&oldLat>0&&oldLng>0;
 const center=valid?[oldLat,oldLng]:[22.631,120.306];
 manualMap=L.map('manualPickerMap').setView(center,valid?17:13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(manualMap);
 if(valid)manualMarker=L.marker(center).addTo(manualMap);
 manualMap.on('click',e=>{
  const {lat,lng}=e.latlng;
  if(manualMarker)manualMarker.setLatLng(e.latlng);else manualMarker=L.marker(e.latlng).addTo(manualMap);
  document.getElementById('editLat').value=lat.toFixed(7);
  document.getElementById('editLng').value=lng.toFixed(7);
  window.manualPicked=true;
  document.getElementById('manualPickerStatus').textContent='已選擇位置：'+lat.toFixed(6)+', '+lng.toFixed(6)+'。確認正確後按下方「儲存變更」。';
 });
 setTimeout(()=>manualMap.invalidateSize(),80);
}

function saveRestaurantEdit(e,id){
 e.preventDefault();const r=db.restaurants.find(x=>x.id===id);if(!r)return;
 const f=new FormData(e.target);const name=String(f.get('name')||'').trim();if(!name)return;
 const address=String(f.get('address')||'').trim();
 const previousAddress=r.address||'';const lat=String(f.get('lat')||'');const lng=String(f.get('lng')||'');
 r.name=name;r.cuisine=String(f.get('cuisine')||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean).join('、');r.address=address;r.note=String(f.get('note')||'');
 if(address!==previousAddress&&!window.manualPicked&&!window.editPlaceCandidates?.some(p=>String(p.lat)===lat&&String(p.lon)===lng)){
 r.lat=null;r.lng=null;toast('地址已變更，請重新確認地圖位置後才會顯示圖釘');
 }else{r.lat=lat?Number(lat):null;r.lng=lng?Number(lng):null}
 window.editPlaceCandidates=null;window.manualPicked=false;save();activeCategory='全部';renderList();renderMarkers();showRestaurant(id);
}

function showRestaurant(id){let r=db.restaurants.find(x=>x.id===id);if(!r)return;selected=id;let src=r.sources.slice().sort((a,b)=>b.added-a.added);modal(`<div class="row between"><h2>🍽️ ${esc(r.name)}</h2><button class="pill" onclick="closeModal()">✕</button></div><div class="muted">${esc(r.cuisine)} · ${r.map==='shared'?'家庭共享':'私人地圖'}</div><p>📍 ${esc(r.address||'未填地址')}</p><div class="row"><button class="soft" onclick="window.open(navigationUrl('${id}'),'_blank','noopener,noreferrer')">導航 / 查地圖 ↗</button><button class="pill" onclick="editRestaurant('${id}')">✏️ 編輯餐廳</button><button class="pill" onclick="locateRestaurant('${id}')">📍 地圖定位</button>${r.lat==null||r.lng==null?`<button class="pill" onclick="editRestaurant('${id}')">🔎 自動補定位</button>`:''}<button class="pill" onclick="editNote('${id}')">編輯備註</button></div><p><b>共同備註</b><br>${esc(r.note||'尚無備註')}</p><div class="row between"><b>推薦來源 (${src.length})</b><button class="soft" onclick="addSourceForm('${id}')">＋ 新增來源</button></div>${src.length?src.map(s=>`<div class="source"><div class="row between"><b>${esc(s.platform)}</b><span class="chip">${s.broken?'⚠️ 連結失效':'正常'}</span></div><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">開啟推薦連結 ↗</a><div class="muted">${esc(s.note)} · ${esc(s.author)} · ${new Date(s.added).toLocaleDateString('zh-TW')}</div><div class="row" style="margin-top:6px"><button class="pill mini" onclick="toggleBroken('${id}','${s.id}')">${s.broken?'標示正常':'標示失效'}</button><button class="pill mini danger" onclick="deleteSource('${id}','${s.id}')">刪除來源</button></div></div>`).join(''):'<p class="muted">尚未加入推薦來源</p>'}<div class="actions"><button class="pill danger" onclick="deleteRestaurant('${id}')">刪除整間餐廳</button><button class="primary" onclick="closeModal()">完成</button></div>`)}function editNote(id){let r=db.restaurants.find(x=>x.id===id);modal(`<h2>編輯共同備註</h2><form onsubmit="saveNote(event,'${id}')"><label class="field">備註<textarea name="note">${esc(r.note)}</textarea></label><div class="actions"><button type="button" class="pill" onclick="showRestaurant('${id}')">返回</button><button class="primary">儲存</button></div></form>`)}function saveNote(e,id){e.preventDefault();db.restaurants.find(r=>r.id===id).note=new FormData(e.target).get('note');save();showRestaurant(id);toast('備註已儲存')}function addSourceForm(id){modal(`<h2>新增推薦來源</h2><form onsubmit="addSource(event,'${id}')"><label class="field">平台<select name="platform"><option>Instagram</option><option>Threads</option><option>Facebook</option><option>Google Maps</option><option>YouTube</option><option>其他</option></select></label><label class="field">推薦網址<input name="url" type="url" required placeholder="https://..."></label><label class="field">我的推薦備註<textarea name="note"></textarea></label><div class="actions"><button type="button" class="pill" onclick="showRestaurant('${id}')">返回</button><button class="primary">加入來源</button></div></form>`)}function addSource(e,id){e.preventDefault();let f=new FormData(e.target);db.restaurants.find(r=>r.id===id).sources.push({id:uid(),author:'我',platform:f.get('platform'),url:f.get('url'),note:f.get('note'),broken:false,added:now()});save();showRestaurant(id);renderList();toast('已新增推薦來源')}function toggleBroken(id,sid){let s=db.restaurants.find(r=>r.id===id).sources.find(s=>s.id===sid);s.broken=!s.broken;save();showRestaurant(id);renderList();toast(s.broken?'已標示連結失效':'已恢復正常')}function deleteSource(id,sid){if(!confirm('將此推薦來源移至回收桶？'))return;let r=db.restaurants.find(r=>r.id===id),s=r.sources.find(s=>s.id===sid);db.trash.push({id:uid(),kind:'source',restaurantId:id,restaurantName:r.name,data:s,deleted:now()});r.sources=r.sources.filter(s=>s.id!==sid);save();showRestaurant(id);renderList();toast('來源已移至回收桶')}function deleteRestaurant(id){if(!confirm('將整間餐廳及其來源移至回收桶？'))return;let r=db.restaurants.find(x=>x.id===id);db.trash.push({id:uid(),kind:'restaurant',data:r,restaurantName:r.name,deleted:now()});db.restaurants=db.restaurants.filter(x=>x.id!==id);save();closeModal();renderList();renderMarkers();toast('餐廳已移至回收桶')}async function checkBackend(){
 modal('<h2>後端連線檢查</h2><p id="backendStatus">正在檢查 Netlify Functions 是否可用…</p><div class="actions"><button class="primary" onclick="closeModal()">關閉</button></div>');
 const el=document.getElementById('backendStatus');
 try{const resp=await fetch('/.netlify/functions/health',{cache:'no-store'});
 if(!resp.ok)throw Error(resp.status===404?'找不到後端函式（HTTP 404）':'HTTP '+resp.status);
 const data=await resp.json();el.innerHTML='<b>後端連線正常</b><p>Google Places：'+(data.googlePlacesConfigured?'已設定 API 金鑰':'未啟用（目前使用免費公開地圖查詢）')+'</p><p class="mini">後端連線成功不代表所有餐廳都能辨識成功。</p>';
 }catch(e){el.textContent='後端目前無法使用：'+e.message+'。如果你是直接把 ZIP 解壓縮後拖到 Netlify，通常不會部署 Functions；需要從 Git 倉庫進行建置。'}
}
function showManagement(){modal(`<h2>⚙️ 家庭資料管理</h2><p class="banner"><b>本機測試模式</b><br>目前以「示範管理者」操作；Google 登入、真實家庭權限、多人同步及伺服器鎖定尚未啟用。</p><div class="card"><b>🔧 自動辨識診斷</b><p class="muted">確認網站是否已啟用 Netlify 後端查詢。</p><button class="soft" onclick="checkBackend()">檢查後端連線</button></div><div class="card"><b>🗑️ 回收桶</b><p class="muted">${db.trash.length} 筆已刪除項目</p><button class="soft" onclick="showTrash()">查看回收桶</button></div><div class="card"><b>💾 安全備份</b><p class="muted">測試 JSON 匯出、清空前備份與選擇性還原</p><div class="row"><button class="soft" onclick="exportShared()">匯出共享資料</button><button class="soft" onclick="importForm()">匯入安全備份</button></div></div><div class="card"><b>📋 還原作業</b><p class="muted">${db.operations.length} 次本機模擬作業</p><button class="soft" onclick="showOperations()">查看結果</button></div><div class="card"><b>🧪 測試工具</b><p class="muted">測試資料僅儲存於目前瀏覽器。</p><button class="pill danger" onclick="resetDemo()">重設所有測試資料</button></div><div class="actions"><button class="primary" onclick="closeModal()">關閉</button></div>`)}function showTrash(){let items=db.trash.slice().sort((a,b)=>a.deleted-b.deleted);modal(`<h2>🗑️ 回收桶</h2><p class="muted">測試版模擬 30 天保留；到期項目不可恢復。</p>${items.length?items.map(t=>`<div class="card"><b>${t.kind==='restaurant'?'整間餐廳':'推薦來源'}｜${esc(t.restaurantName)}</b><div class="muted">刪除於 ${new Date(t.deleted).toLocaleString('zh-TW')} · 剩餘 ${Math.max(0,30-Math.floor((now()-t.deleted)/86400000))} 天</div><div class="row" style="margin-top:8px"><button class="soft" onclick="restoreTrash('${t.id}')">恢復</button><button class="pill danger" onclick="permanentDelete('${t.id}')">永久刪除</button></div></div>`).join(''):'<div class="empty">回收桶目前是空的</div>'}<div class="actions"><button class="pill" onclick="showManagement()">返回管理</button>${items.length?'<button class="pill" onclick="exportSafety()">下載清空前安全備份</button><button class="primary" onclick="emptyTrash()">清空回收桶</button>':''}</div>`)}function restoreTrash(id){let t=db.trash.find(x=>x.id===id);if(!t)return;if(now()-t.deleted>=30*86400000){toast('此項目已超過 30 天，無法恢復');return}if(t.kind==='restaurant'){if(db.restaurants.some(r=>r.id===t.data.id)){toast('餐廳已存在，請先處理衝突');return}db.restaurants.push(t.data)}else{let r=db.restaurants.find(x=>x.id===t.restaurantId);if(!r){toast('原餐廳不存在，無法直接恢復來源');return}if(r.sources.some(s=>s.id===t.data.id)){toast('來源已存在');return}r.sources.push(t.data)}db.trash=db.trash.filter(x=>x.id!==id);save();showTrash();renderList();renderMarkers();toast('已從回收桶恢復')}function permanentDelete(id){if(!confirm('永久刪除後無法透過回收桶恢復，確定嗎？'))return;db.trash=db.trash.filter(x=>x.id!==id);save();showTrash()}function download(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已要求瀏覽器下載，請確認檔案是否儲存成功')}function exportShared(){download({type:'foodmap-shared-demo',schema:1,exportedAt:new Date().toISOString(),restaurants:db.restaurants.filter(r=>r.map==='shared')},'foodmap_shared_demo.json')}function safetyData(){return{type:'foodmap-safety-demo',schema:1,mapId:'demo-family-map',exportedAt:new Date().toISOString(),items:db.trash.filter(t=>t.data.map!=='private'&&!(t.kind==='source'&&db.restaurants.find(r=>r.id===t.restaurantId)?.map==='private'))}}function exportSafety(){download(safetyData(),'foodmap_safety_demo.json')}function emptyTrash(){let n=db.trash.length;let word=prompt(`即將永久刪除回收桶中的 ${n} 筆項目。請輸入「清空回收桶」確認：`);if(word!=='清空回收桶'){toast('已取消清空');return}db.trash=[];save();showTrash();toast('回收桶已清空；如有需要請使用事先下載的安全備份')}function importForm(){modal(`<h2>匯入安全備份｜測試</h2><p class="muted">只接受本測試版產生的 foodmap-safety-demo JSON。正式版會增加 Map ID、版本、權限及衝突驗證。</p><label class="field">選擇 JSON 檔案<input id="backupFile" type="file" accept=".json,application/json"></label><div class="actions"><button class="pill" onclick="showManagement()">返回</button><button class="primary" onclick="previewImport()">預覽內容</button></div>`)}let importItems=[];async function previewImport(){let f=document.getElementById('backupFile').files[0];if(!f){toast('請先選擇 JSON 檔案');return}try{let data=JSON.parse(await f.text());if(data.type!=='foodmap-safety-demo'||data.mapId!=='demo-family-map'||!Array.isArray(data.items))throw Error('格式或地圖不符');importItems=data.items;modal(`<h2>選擇要還原的項目</h2><p class="muted">預設不勾選任何項目。這是本機模擬還原，不會覆蓋已存在的餐廳或來源。</p>${importItems.length?importItems.map((t,i)=>`<label class="card row"><input type="checkbox" class="restoreChoice" value="${i}"><span>${t.kind==='restaurant'?'🍽️ 餐廳':'🔗 來源'}｜${esc(t.restaurantName)}</span></label>`).join(''):'<div class="empty">備份沒有已刪除項目</div>'}<div class="actions"><button class="pill" onclick="importForm()">返回</button><button class="primary" onclick="performImport()">確認還原選取項目</button></div>`)}catch(e){toast('無法讀取備份：'+e.message)}}function performImport(){let choices=[...document.querySelectorAll('.restoreChoice:checked')].map(x=>importItems[Number(x.value)]);if(!choices.length){toast('請至少選擇一筆');return}if(!confirm(`確定嘗試還原 ${choices.length} 筆選取項目？`))return;let ok=0,skipped=0;for(let t of choices){if(t.kind==='restaurant'){if(db.restaurants.some(r=>r.id===t.data.id)){skipped++;continue}db.restaurants.push({...t.data,map:'shared'});ok++}else{let r=db.restaurants.find(x=>x.id===t.restaurantId);if(!r||r.sources.some(s=>s.id===t.data.id)){skipped++;continue}r.sources.push(t.data);ok++}}db.operations.unshift({id:uid(),at:now(),ok,skipped,total:choices.length});db.notifications.unshift({id:uid(),title:'安全備份還原測試完成',detail:`成功 ${ok} 筆、略過 ${skipped} 筆`,read:false,at:now()});save();renderList();renderMarkers();showOperations();toast(`已完成測試還原：成功 ${ok}、略過 ${skipped}`)}function showOperations(){modal(`<h2>📋 安全備份還原紀錄</h2><p class="muted">以下僅為本機測試紀錄，非不可竄改的正式稽核。</p>${db.operations.length?db.operations.map(o=>`<div class="card"><b>${new Date(o.at).toLocaleString('zh-TW')}</b><p>選取 ${o.total} · 成功 ${o.ok} · 略過 ${o.skipped}</p></div>`).join(''):'<div class="empty">尚無還原作業</div>'}<div class="actions"><button class="primary" onclick="showManagement()">返回管理</button></div>`)}function showNotifications(){let ns=db.notifications;modal(`<div class="row between"><h2>🔔 通知中心</h2><button class="pill" onclick="markAllRead()">全部標示已讀</button></div><div class="tabs"><button class="soft" onclick="notificationTab('all')">全部</button><button class="soft" onclick="notificationTab('unread')">未讀</button><button class="soft" onclick="notificationTab('pending')">待處理</button></div><div id="notificationContent"></div><div class="actions"><button class="pill danger" onclick="deleteAllNotifications()">全部刪除</button><button class="primary" onclick="closeModal()">關閉</button></div>`);notificationTab('all')}function notificationTab(tab){let n=tab==='unread'?db.notifications.filter(n=>!n.read):db.notifications;let html=tab==='pending'?`<div class="card"><b>目前待處理</b><p class="muted">回收桶 ${db.trash.length} 筆 · 安全備份作業 ${db.operations.length} 次</p><p class="muted">正式版將依伺服器還原狀態及各裝置暫存計算。</p></div>`:n.length?n.map(x=>`<div class="notice"><b>${esc(x.title)}</b>${x.read?'':' <span class="chip">未讀</span>'}<div class="muted">${esc(x.detail)} · ${new Date(x.at).toLocaleString('zh-TW')}</div></div>`).join(''):'<div class="empty">目前沒有通知</div>';document.getElementById('notificationContent').innerHTML=html}function markAllRead(){db.notifications.forEach(n=>n.read=true);save();renderBell();showNotifications();toast('已標示全部已讀；不影響待處理工作')}function deleteAllNotifications(){if(!db.notifications.length){toast('沒有可刪除的通知');return}if(!confirm(`確定刪除 ${db.notifications.length} 則通知？不會刪除待處理工作。`))return;let old=db.notifications.slice();db.notifications=[];save();renderBell();showNotifications();let e=document.getElementById('notificationContent');e.innerHTML='<div class="empty">通知已清空</div><button class="soft" onclick="undoDeleteNotifications()">↶ 5 秒內復原</button>';window.undoNotices=old;clearTimeout(window.undoTimer);window.undoTimer=setTimeout(()=>window.undoNotices=null,5000)}function undoDeleteNotifications(){if(!window.undoNotices){toast('復原期限已過');return}db.notifications=[...window.undoNotices,...db.notifications];window.undoNotices=null;save();renderBell();showNotifications();toast('已復原通知')}function renderBell(){document.getElementById('bell').textContent='🔔 '+db.notifications.filter(n=>!n.read).length}function resetDemo(){if(prompt('將清除這台瀏覽器內所有 Food Map 測試資料。請輸入「重設」確認：')!=='重設')return;localStorage.removeItem(KEY);location.reload()}save();renderList();renderBell();initMap();</script></body></html>
